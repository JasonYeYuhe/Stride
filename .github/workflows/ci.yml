name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

# A newer push to the same pull request makes the running check worthless; cancel it, since
# macOS minutes are metered on this plan. Pushes to main/release are never cancelled, so every
# commit there keeps a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# `shell: bash` makes GitHub run steps with -eo pipefail (the implicit default is -e only),
# so a failing command piped into tee still fails its step.
defaults:
  run:
    shell: bash

jobs:
  # Which halves changed, decided by scripts/ci/changed_areas.sh — the same list the pre-push
  # hook uses. Per-job path filtering is not something workflow-level `paths:` can do, and a
  # workflow skipped by `paths:` would leave a required check pending forever; a job skipped
  # by `if:` counts as passed. Server- or docs-only changes do not start the macOS job;
  # Swift-only changes do not start the server job; this file and scripts/ci/ start both.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apple: ${{ steps.areas.outputs.apple }}
      server: ${{ steps.areas.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: areas
        env:
          # PR: the PR's own commits. Push: what this push added (all zeros for a new
          # branch, which the script treats as "everything changed").
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: scripts/ci/changed_areas.sh "$BASE" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"

  server:
    name: Server
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm test
      # tsc --noEmit over the JSDoc-typed sources. The script existed and had never run in CI.
      - run: npm run typecheck

  # Everything Apple in ONE job with named steps: each macOS job pays its own queue time and
  # setup, and the xcode-27 image is a preview that may queue.
  #
  # Why xcode-27: releases are built with Xcode 27, and CI on Xcode 16 (what this job used to
  # run) proves little about them. macos-15 and macos-26 top out at Xcode 26.x; the preview
  # image behind this label ships Xcode 27 with the iOS 27 SDK (actions/runner-images#14404).
  # If it stops working, scripts/git-hooks/pre-push runs the same iOS build + product check
  # locally; that is the gate until an image is back.
  #
  # iOS used to be impossible here (no simulator runtime matching the SDK). It still needs no
  # simulator: the build is for generic/platform=iOS, a device destination, unsigned. The
  # host-less StrideTests run on macOS for the same reason.
  apple:
    name: Apple (Xcode 27)
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      REQUIRED_XCODE_MAJOR: "27"
      # The committed Stride.xcodeproj is generated by exactly this version; keep in sync with
      # EXPECTED_XCODEGEN in scripts/ci/check_xcodegen_drift.sh. The checksum is the release
      # asset's sha256 as published by GitHub for xcodegen.zip.
      XCODEGEN_VERSION: "2.45.3"
      XCODEGEN_SHA256: 0c90f4d28ca57335f9fa78cf5bf6dabfe20a232036dabe36de2eef79cb7c0878

    steps:
      - uses: actions/checkout@v4

      # Pin to the major that ships. A runner-image update that changes the default Xcode must
      # turn this red, not quietly turn CI into a test of a different compiler.
      - name: Require Xcode ${{ env.REQUIRED_XCODE_MAJOR }}
        run: |
          major() { xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p'; }
          if [[ "$(major)" != "$REQUIRED_XCODE_MAJOR" ]]; then
            # Not the default: use an installed Xcode_27*.app if the image has one.
            for x in /Applications/Xcode_${REQUIRED_XCODE_MAJOR}*.app; do
              [[ -d "$x" ]] || continue
              export DEVELOPER_DIR="$x/Contents/Developer"
              echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
              break
            done
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          if [[ "$(major)" != "$REQUIRED_XCODE_MAJOR" ]]; then
            echo "::error::Xcode $(major) on this runner; releases ship from Xcode $REQUIRED_XCODE_MAJOR."
            ls -d /Applications/Xcode*.app
            exit 1
          fi

      - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }}
        run: |
          zip="$RUNNER_TEMP/xcodegen.zip"
          curl -fsSL -o "$zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $zip" | shasum -a 256 -c -
          unzip -q "$zip" -d "$RUNNER_TEMP/xcodegen"
          # Keep the archive's layout: the binary finds its SettingPresets relative to itself.
          bin="$(find "$RUNNER_TEMP/xcodegen" -type f -name xcodegen -perm -u+x | head -1)"
          [[ -n "$bin" ]] || { find "$RUNNER_TEMP/xcodegen"; echo "::error::no xcodegen binary in the archive"; exit 1; }
          dirname "$bin" >> "$GITHUB_PATH"
          "$bin" --version

      - name: Stride.xcodeproj matches project.yml
        id: xcodegen
        run: scripts/ci/check_xcodegen_drift.sh

      # The steps below each run as long as the project exists, even if an earlier one failed,
      # so one run reports every broken thing instead of the first (reruns cost macOS minutes).
      - name: Cache Swift packages
        if: ${{ !cancelled() && steps.xcodegen.outcome != 'skipped' }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Stride.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Resolve Swift packages
        id: resolve
        if: ${{ !cancelled() && steps.xcodegen.outcome != 'skipped' }}
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Stride.xcodeproj \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile

      # Asserts PlugIns/StrideWidgetExtension.appex, both privacy manifests, Info.plist
      # sanity and Sentry in the built app (scripts/ci/product_checks.sh has the history).
      - name: iOS build (generic device) + product check
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: |
          scripts/ci/build_ios_generic.sh "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile

      # Before this step existed only the server suite and a macOS compile ran in CI, so a
      # regression like the 1.2.1 day-key bug (TimezoneTests existed for exactly that) could
      # land green. StrideTests is host-less and builds for macOS; the hosted suite needs a
      # simulator and runs locally as a release gate.
      - name: StrideTests (macOS)
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project Stride.xcodeproj \
            -scheme StrideTests \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/test.log"
          # xcodebuild can exit 0 having run nothing (see project.yml). Require real tests.
          grep -E "Executed [1-9][0-9]* tests?, with 0 failures" "$RUNNER_TEMP/test.log"

      - name: macOS build + product check
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: |
          xcodebuild build \
            -project Stride.xcodeproj \
            -scheme StrideMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile \
            -quiet \
            CODE_SIGNING_ALLOWED=NO
          scripts/ci/check_macos_product.sh "$RUNNER_TEMP/DerivedData/Build/Products/Debug/Stride.app"

      # The hosted suite (StrideAppTests, TEST_HOST = Stride.app): APIClient's 401 and decoding,
      # SyncService's push-before-pull and acknowledge-after-push, AuthService, reminder planning.
      # It needs a simulator to host the app, which only this image has (an iOS 27 runtime; the
      # older images had none matching their SDK). The same script is the ship.sh release gate,
      # so this and the gate cannot disagree about what "passed" means — it fails if nothing ran.
      # Last, because it is the slowest step (a second, simulator build) and the flakiest
      # (simulator boot on a preview image); its own timeout keeps a wedged simulator from
      # eating the job's hour. Added in M0 without having run on the runner: the first run is
      # its validation.
      - name: Hosted tests (iOS simulator)
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        timeout-minutes: 25
        env:
          STRIDE_HOSTED_DERIVED_DATA: ${{ runner.temp }}/DerivedData-sim
          TMPDIR: ${{ runner.temp }}
        run: |
          xcrun simctl list devices available | grep -E "^-- iOS|iPhone" || true
          scripts/ci/run_hosted_tests.sh "" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -onlyUsePackageVersionsFromResolvedFile

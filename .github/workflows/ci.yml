name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm test

  # iOS build disabled in CI due to GitHub runner limitations:
  # - macos-15 ships Xcode 16 but iOS simulator runtimes are not preinstalled
  # - -downloadPlatform iOS downloads runtimes that don't match the SDK build version
  # - generic/platform=iOS Simulator still needs a runtime to compile asset catalogs
  # - macos-14 has Xcode 15 which can't read Stride's project format (v77, Xcode 16+)
  # macOS build covers the shared Swift code; rotation automation's local build
  # (Xcode with proper simulators) catches iOS-specific issues.

  macos-build:
    name: macOS Build
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build macOS target
        run: |
          xcodebuild build \
            -scheme StrideMac \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm test

  ios-build-and-test:
    name: iOS Build & Test
    # Need Xcode 16 (project format 77). macos-15 has Xcode 16 but iOS
    # simulator runtimes need explicit download + device creation.
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Download iOS platform + create simulator
        run: |
          echo "=== Before: available runtimes ==="
          xcrun simctl list runtimes
          echo ""
          # Download iOS platform (installs SDK + simulator runtime)
          sudo xcodebuild -downloadPlatform iOS
          echo ""
          echo "=== After: available runtimes ==="
          xcrun simctl list runtimes
          echo ""
          echo "=== Available device types with iOS ==="
          xcrun simctl list devicetypes | grep -i iPhone | head -10
          echo ""
          # Find latest installed iOS runtime ID
          RUNTIME_ID=$(xcrun simctl list runtimes --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          ios_runtimes = [r for r in data['runtimes'] if r['platform'] == 'iOS' and r.get('isAvailable', False)]
          if not ios_runtimes:
              print('NONE', file=sys.stderr); sys.exit(1)
          latest = sorted(ios_runtimes, key=lambda r: r['version'], reverse=True)[0]
          print(latest['identifier'])
          ")
          echo "Using runtime: $RUNTIME_ID"
          # Create an iPhone 16 Pro device if none exists
          if ! xcrun simctl list devices available iOS | grep -q "iPhone 16 Pro"; then
              xcrun simctl create "iPhone 16 Pro" "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro" "$RUNTIME_ID"
          fi
          echo ""
          echo "=== Final available iPhone devices ==="
          xcrun simctl list devices available iOS | grep iPhone

      - name: Build iOS target
        run: |
          xcodebuild build \
            -scheme Stride \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Run StrideTests
        run: |
          xcodebuild test \
            -scheme StrideTests \
            -project Stride.xcodeproj \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

  macos-build:
    name: macOS Build
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build macOS target
        run: |
          xcodebuild build \
            -scheme StrideMac \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

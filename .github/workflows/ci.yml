name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm test

  ios-build-and-test:
    name: iOS Build & Test
    # macos-14 has iOS 17 simulators preinstalled with Xcode 15
    # (macos-15 + Xcode 16 requires separate simulator runtime download)
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List available iOS simulators
        run: xcrun simctl list devices available iOS

      - name: Determine iOS simulator to use
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available iOS --json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          candidates = []
          for runtime, devs in data['devices'].items():
              for d in devs:
                  if 'iPhone' in d['name'] and d.get('isAvailable', False):
                      candidates.append(d['name'])
          for pref in ['iPhone 15 Pro', 'iPhone 15', 'iPhone 14 Pro', 'iPhone 14']:
              if pref in candidates:
                  print(pref)
                  sys.exit(0)
          if candidates:
              print(candidates[0])
          else:
              print('NONE', file=sys.stderr)
              sys.exit(1)
          ")
          echo "Selected: $DEVICE"
          echo "device=$DEVICE" >> $GITHUB_OUTPUT

      - name: Build iOS target
        run: |
          xcodebuild build \
            -scheme Stride \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Run StrideTests
        run: |
          xcodebuild test \
            -scheme StrideTests \
            -project Stride.xcodeproj \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

  macos-build:
    name: macOS Build
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build macOS target
        run: |
          xcodebuild build \
            -scheme StrideMac \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

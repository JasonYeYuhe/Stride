name: Stride
options:
  bundleIdPrefix: yyh.stride
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant, ja, ko, es]

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.2.1"
    CURRENT_PROJECT_VERSION: 15
    DEVELOPMENT_TEAM: KHMK6Q3L3K
    CODE_SIGN_STYLE: Automatic

packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.45.0"

targets:
  Stride:
    type: application
    platform: iOS
    sources:
      - Stride/Sources
      - Stride/Assets.xcassets
      - Stride/PrivacyInfo.xcprivacy
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yyh.stride.habittracker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: Stride/Stride.entitlements
        # Do NOT add INFOPLIST_KEY_SentryDSN here. GENERATE_INFOPLIST_FILE only
        # maps Xcode's fixed INFOPLIST_KEY_* allowlist into the built plist and
        # drops custom names silently, so it shipped dead. DSN now lives in
        # Shared/SentryBootstrap.swift.
      configs:
        debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - package: Sentry
        product: Sentry

  StrideMac:
    type: application
    platform: macOS
    sources:
      - Stride/Sources
      - Stride/Assets.xcassets
      - Stride/PrivacyInfo.xcprivacy
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yyh.stride.habittracker
        PRODUCT_NAME: Stride
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.healthcare-fitness"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: StrideMac/StrideMac.entitlements
        # See the Stride target above — same silently-dropped-key trap.
      configs:
        debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - package: Sentry
        product: Sentry

  StrideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StrideTests
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yyh.stride.habittracker.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""

  StrideWatch:
    type: application
    platform: watchOS
    sources:
      - StrideWatch/Sources
      - StrideWatch/Assets.xcassets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yyh.stride.habittracker.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: yyh.stride.habittracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: StrideWatch/StrideWatch.entitlements
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
      configs:
        debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

  StrideWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - StrideWidget/Sources
      - StrideWidget/Assets.xcassets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yyh.stride.habittracker.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: StrideWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: StrideWidget/StrideWidget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
      configs:
        debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - target: Stride
        embed: false

schemes:
  Stride:
    build:
      targets:
        Stride: all
        StrideTests: [test]
    run:
      config: Debug
    # Without this, `xcodebuild -scheme Stride test` exits 0 having run nothing
    # ("Scheme Stride is not currently configured for the test action") — a green
    # CI result that proves absolutely nothing.
    test:
      config: Debug
      targets:
        - StrideTests
    archive:
      config: Release
  StrideMac:
    build:
      targets:
        StrideMac: all
    run:
      config: Debug
    archive:
      config: Release

name: Stride
options:
  bundleIdPrefix: yyh.stride
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"
  # generateEmptyDirectories stays off: git does not track empty directories, so with it on
  # the generated project depended on what happened to exist on disk. A local-only empty
  # Stride/Sources/Models put a "Models" group into the committed pbxproj that a clean
  # checkout could never reproduce, and the CI drift check failed on it.
  generateEmptyDirectories: false
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant, ja, ko, es]

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.2.3"
    CURRENT_PROJECT_VERSION: 17
    DEVELOPMENT_TEAM: KHMK6Q3L3K
    CODE_SIGN_STYLE: Automatic

packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.45.0"

targets:
  Stride:
    type: application
    platform: iOS
    sources:
      - Stride/Sources
      - Stride/Assets.xcassets
      - Stride/PrivacyInfo.xcprivacy
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yyh.stride.habittracker
        GENERATE_INFOPLIST_FILE: YES
        # The 1.2.3 archive's Info.plist had no CFBundleDisplayName at all: nothing ever set
        # it, so the home-screen name fell back to CFBundleName. CFBundleDisplayName IS on
        # the INFOPLIST_KEY_* allowlist (unlike SentryDSN below), and
        # scripts/verify_archive.sh now asserts it in every archive that ships.
        INFOPLIST_KEY_CFBundleDisplayName: Stride
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_ENTITLEMENTS: Stride/Stride.entitlements
        # Do NOT add INFOPLIST_KEY_SentryDSN here. GENERATE_INFOPLIST_FILE only
        # maps Xcode's fixed INFOPLIST_KEY_* allowlist into the built plist and
        # drops custom names silently, so it shipped dead. DSN now lives in
        # Shared/SentryBootstrap.swift.
      configs:
        debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - package: Sentry
        product: Sentry
      # Explicit, although XcodeGen 2.45.3 embeds an app's extension dependencies
      # by default (deleting this line changes nothing in the pbxproj). With
      # `embed: false`, or with no dependency, the extension is never copied into
      # the .app: no "Embed Foundation Extensions" phase, Stride.app has no
      # PlugIns/ directory, and the widget does not exist for any user — while
      # the App Store description, the keyword list and the Pro feature list all
      # sell it. The dependency used to point the other way (extension -> app,
      # embed: false), which builds fine and ships nothing.
      - target: StrideWidgetExtension
        embed: false

  StrideMac:
    type: application
    platform: macOS
    sources:
      - Stride/Sources
      - Stride/Assets.xcassets
      - Stride/PrivacyInfo.xcprivacy
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yyh.stride.habittracker
        PRODUCT_NAME: Stride
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Stride
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.healthcare-fitness"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: StrideMac/StrideMac.entitlements
        # See the Stride target above — same silently-dropped-key trap.
      configs:
        debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - package: Sentry
        product: Sentry

  StrideTests:
    type: bundle.unit-test
    # macOS too, so CI can run the suite without an iOS simulator runtime (GitHub's runners
    # don't have one that matches the SDK — see ci.yml). The target is host-less and compiles
    # only StrideTests/ + Shared/, which already builds for macOS as part of StrideMac.
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - StrideTests
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yyh.stride.habittracker.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""

  # Hosted tests: TEST_HOST = Stride.app (xcodegen derives TEST_HOST/BUNDLE_LOADER from the
  # dependency below), so `@testable import Stride` reaches what StrideTests cannot — APIClient,
  # SyncService.sync, AuthService, NotificationService, StoreService. The price is a simulator:
  # a hosted bundle cannot run on a generic destination or on macOS, so CI keeps the host-less
  # StrideTests, and this suite is a release gate instead (scripts/ci/run_hosted_tests.sh,
  # called by scripts/ship.sh before anything is archived). Tests go through the services'
  # injection points with a stubbed URLSession, an in-memory token store and throwaway
  # defaults — never the host app's Keychain item, UserDefaults or notification store.
  StrideAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StrideAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yyh.stride.habittracker.apptests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Stride

  # There was a watchOS app target here until 1.3.0. It was never embedded (no
  # "Embed Watch Content" phase; absent from the 1.2.3 archive), had no sync path to the
  # server, and was never sold — it only cost build time and every a11y/l10n pass. The
  # sources are in git history (last present at ab9e854) if a watch app is ever built.

  StrideWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - StrideWidget/Sources
      - StrideWidget/Assets.xcassets
      # Its own manifest, not the app's: the appex runs as a separate bundle that touches
      # app-group UserDefaults (required-reason API) and shipped through 1.2.3 declaring
      # nothing. The app's manifest declares email/user-content collection the widget never
      # does; App Store Connect aggregates both into one privacy report anyway.
      - StrideWidget/PrivacyInfo.xcprivacy
      - path: Shared
        excludes:
          # Not referenced by this target, and compiling it here is actively
          # harmful: `#if canImport(Sentry)` makes the compiler probe for the
          # module, and because the app has already built Sentry.framework into
          # the SHARED products directory it finds a binary framework it does not
          # link. It then tries to rebuild the module from
          # Sentry.swiftmodule/*.private.swiftinterface and fails — the binary is
          # built with Swift 5.9.2 while the toolchain is 6.3.3. The guard's
          # comment assumes canImport is false in targets that don't link Sentry;
          # that only held while this target was never built at all.
          - "SentryBootstrap.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: yyh.stride.habittracker.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: StrideWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: StrideWidget/StrideWidget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
      configs:
        debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

schemes:
  Stride:
    build:
      targets:
        Stride: all
        StrideTests: [test]
        StrideAppTests: [test]
    run:
      config: Debug
      # Local StoreKit testing for Run from Xcode: the paywall gets Monthly/Yearly/Lifetime
      # without a sandbox account. Run action only — archives and CI never see it.
      storeKitConfiguration: Stride/Configuration.storekit
    # Without this, `xcodebuild -scheme Stride test` exits 0 having run nothing
    # ("Scheme Stride is not currently configured for the test action") — a green
    # CI result that proves absolutely nothing.
    test:
      config: Debug
      targets:
        - StrideTests
        - StrideAppTests
    archive:
      config: Release
  # Tests only, no app: lets `xcodebuild test -scheme StrideTests -destination platform=macOS`
  # run where the Stride scheme can't (its app target is iOS-only).
  StrideTests:
    build:
      targets:
        StrideTests: [test]
    test:
      config: Debug
      targets:
        - StrideTests
  StrideMac:
    build:
      targets:
        StrideMac: all
    run:
      config: Debug
      storeKitConfiguration: Stride/Configuration.storekit
    archive:
      config: Release
